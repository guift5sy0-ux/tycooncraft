# 코드가 올라올 때마다 GitHub 서버에서 모드 jar를 빌드합니다.
# 결과: Actions 탭 → 해당 실행 → Artifacts 의 "tycooncraft-jar"
# 빌드와 서버 테스트가 통과하면 Releases 에도 jar가 올라갑니다.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: ver
        run: echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-configuration-cache 2>&1 | tee build-log.txt
          exit ${PIPESTATUS[0]}

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tycooncraft-jar
          path: build/libs/*.jar

      # 실제 마인크래프트 서버를 켜서 모드가 오류 없이 로드되는지 확인
      - name: Server smoke test
        if: success()
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf "level-type=minecraft\\:flat\nspawn-protection=0\nonline-mode=false\n" > run/server.properties
          ./gradlew runServer --no-configuration-cache > server-log.txt 2>&1 &
          PID=$!
          for i in $(seq 1 120); do
            if grep -q "Done (" server-log.txt; then echo "SERVER STARTED"; break; fi
            if ! kill -0 $PID 2>/dev/null; then echo "SERVER EXITED"; break; fi
            sleep 5
          done
          sleep 15
          pkill -f "net.neoforged" || true
          kill $PID 2>/dev/null || true
          sleep 5
          cp run/logs/latest.log server-latest.log 2>/dev/null || true
          grep -E "ERROR|Exception|Couldn't|Failed to|Caused by|tycooncraft" server-latest.log server-log.txt > smoke-errors.txt || true
          grep -q "Done (" server-log.txt

      # 게임 클라이언트를 가상 화면에서 켜서 텍스처·모델·화면 등록 오류 확인
      - name: Client smoke test
        if: success()
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq xvfb > /dev/null
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient --no-configuration-cache > client-log.txt 2>&1 &
          PID=$!
          for i in $(seq 1 60); do
            if grep -q "Sound engine started" client-log.txt; then echo "CLIENT LOADED"; break; fi
            if grep -q "Crash Report" client-log.txt; then echo "CLIENT CRASHED"; break; fi
            if ! kill -0 $PID 2>/dev/null; then echo "CLIENT EXITED"; break; fi
            sleep 5
          done
          sleep 30
          pkill -f "net.neoforged" || true
          kill $PID 2>/dev/null || true
          grep -E "Crash Report|Exception|Missing|Unable to|Failed to|tycooncraft:" client-log.txt | grep -vE "DEBUG" > client-errors.txt || true
          grep -q "Sound engine started" client-log.txt

      # 실제 월드에서 자동차·헬기·기관차를 꺼내 타고 움직이며 스크린샷 (CI 전용 자동 시험)
      - name: Vehicle in-game test
        if: success()
        continue-on-error: true
        run: |
          mkdir -p run/saves
          rm -rf run/saves/autotest
          cp -r run/world run/saves/autotest
          rm -f run/saves/autotest/session.lock
          printf "pauseOnLostFocus:false\nonboardAccessibility:false\ntutorialStep:none\nskipMultiplayerWarning:true\nrenderDistance:8\nguiScale:2\n" > run/options.txt
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runAutoClient --no-configuration-cache > vehicle-log.txt 2>&1 &
          PID=$!
          for i in $(seq 1 200); do
            if grep -q "AUTOTEST\] finished" vehicle-log.txt; then echo "AUTOTEST FINISHED"; break; fi
            if grep -q "Crash Report" vehicle-log.txt; then echo "CLIENT CRASHED"; break; fi
            if ! kill -0 $PID 2>/dev/null; then echo "CLIENT EXITED"; break; fi
            sleep 5
          done
          sleep 10
          pkill -f "net.neoforged" || true
          kill $PID 2>/dev/null || true
          mkdir -p /tmp/shots
          cp run/screenshots/*.png /tmp/shots/ 2>/dev/null || true
          ls -la /tmp/shots
          grep -E "AUTOTEST|Exception|Crash|ERROR" vehicle-log.txt | grep -v DEBUG | head -200 > vehicle-errors.txt || true

      # 전용 서버를 켜고 다른 클라이언트가 접속해 드론 소환·클릭 폭파 (멀티플레이 전용 버그 확인)
      - name: Multiplayer drone test
        if: success()
        continue-on-error: true
        run: |
          pkill -f "net.neoforged" || true
          sleep 3
          rm -rf /tmp/mpclient && cp -r . /tmp/mpclient
          rm -rf /tmp/mpclient/run && mkdir -p /tmp/mpclient/run
          printf "pauseOnLostFocus:false\nonboardAccessibility:false\ntutorialStep:none\nskipMultiplayerWarning:true\nrenderDistance:6\n" > /tmp/mpclient/run/options.txt
          ./gradlew runMpServer --no-configuration-cache > mp-server-log.txt 2>&1 &
          for i in $(seq 1 120); do
            if grep -q "Done (" mp-server-log.txt; then echo "MP SERVER STARTED"; break; fi
            sleep 5
          done
          (cd /tmp/mpclient && xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runMpClient --no-configuration-cache > $GITHUB_WORKSPACE/mp-client-log.txt 2>&1) &
          for i in $(seq 1 150); do
            if grep -q "MPTEST\] finished" mp-client-log.txt 2>/dev/null; then echo "MP TEST FINISHED"; break; fi
            if grep -q "Crash Report" mp-client-log.txt 2>/dev/null; then echo "MP CLIENT CRASHED"; break; fi
            sleep 5
          done
          sleep 5
          pkill -f "net.neoforged" || true
          sleep 3
          grep -aE "MPTEST|lost connection|Exception|Caused by|ERROR|kicked|Disconnect" mp-server-log.txt | grep -v DEBUG | head -150 > mp-errors.txt || true
          echo "---- client ----" >> mp-errors.txt
          grep -aE "MPTEST|Exception|Caused by|ERROR|Disconnect|Crash" mp-client-log.txt | grep -v DEBUG | head -150 >> mp-errors.txt || true

      - name: Save logs
        if: always()
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          mkdir -p /tmp/logs
          cp build-log.txt server-log.txt server-latest.log smoke-errors.txt client-log.txt client-errors.txt vehicle-log.txt vehicle-errors.txt mp-server-log.txt mp-client-log.txt mp-errors.txt /tmp/logs/ 2>/dev/null || true
          grep -E "error:|warning:|FAILURE|What went wrong|\.java:[0-9]+" build-log.txt > /tmp/logs/build-errors.txt || true
          # 바닐라 보스 텍스처 UV 배치 참고용 (외형 재설계용 마스크)
          J=$(ls build/moddev/artifacts/*client-extra*.jar 2>/dev/null | head -1)
          mkdir -p /tmp/ref
          if [ -n "$J" ]; then unzip -o -q "$J" 'assets/minecraft/textures/entity/wither/*' 'assets/minecraft/textures/entity/enderdragon/*' -d /tmp/ref || true; fi
          git checkout --orphan ci-log
          git rm -rf --cached . > /dev/null
          git clean -fdq -e build -e run || true
          cp /tmp/logs/* .
          mkdir -p shots && cp /tmp/shots/*.png shots/ 2>/dev/null || true
          mkdir -p ref && cp -r /tmp/ref/assets ref/ 2>/dev/null || true
          git add -f *.txt *.log shots ref 2>/dev/null || true
          git commit -qm "logs ${{ github.sha }}" || true
          git push -qf origin ci-log

      # 빌드·서버 테스트가 모두 통과하면 Releases 에 jar 올리기 (버전별)
      - name: Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: TycoonCraft ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: build/libs/*.jar
          make_latest: true
